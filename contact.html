<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt | Ivan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Ivan<span>.dev</span></a>
    <button class="nav-toggle" aria-label="Otvori izbornik" aria-expanded="false">☰</button>
    <nav class="site-nav" aria-label="Glavna navigacija">
      <ul role="presentation">
        <li><a href="index.html">Projekti</a></li>
        <li><a href="contact.html" aria-current="page">Kontakt</a></li>
        <li><button class="theme-toggle" aria-label="Promijeni temu">🌙</button></li>
      </ul>
    </nav>
  </header>

  <main class="contact">
    <section class="contact-card">
      <div class="avatar" role="img" aria-label="Avatar">👨‍💻</div>
      <h1>Javi se!</h1>
      <p class="lead">Otvoren sam za suradnju, freelance projekte i juniorske front-end pozicije.</p>


      <form class="contact-form" novalidate>
        <label for="name">Ime</label>
        <input id="name" name="name" type="text" required minlength="2">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Poruka</label>
        <textarea id="message" name="message" rows="4" required minlength="10"></textarea>

        <button class="btn" type="submit">Pošalji</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Ivan · Napravljeno u sklopu Codecademy Front-End Engineer puta</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
